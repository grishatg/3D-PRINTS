<!doctype html><html><body style="margin:0;background:#000"><script src="three.min.js"></script><script>
// Generic scene viewer. ?s=<scene>.json  Scene: {w,h,bg,cam:{p,l,u,fov,ortho?},lights:[...],meshes:[{bin,nv,nt,c,rough,metal,emissive,ei,double,flat,opacity}],exposure}
const P=new URLSearchParams(location.search);
(async()=>{
const sc=await (await fetch(P.get('s'))).json();
const W=sc.w||1600,H=sc.h||1200;
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setSize(W,H); R.setPixelRatio(1);
R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=sc.exposure||1.0;
R.shadowMap.enabled=!!sc.shadows; R.shadowMap.type=THREE.PCFSoftShadowMap; R.physicallyCorrectLights=true;
document.body.appendChild(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(sc.bg||'#eceae4');
if(sc.fog) S.fog=new THREE.Fog(sc.fog.c,sc.fog.n,sc.fog.f);
let cam; const C=sc.cam;
if(C.ortho){const a=W/H,s=C.ortho; cam=new THREE.OrthographicCamera(-s*a,s*a,s,-s,1,5000);} else cam=new THREE.PerspectiveCamera(C.fov||25,W/H,5,5000);
cam.up.set(...(C.u||[0,0,1])); cam.position.set(...C.p); cam.lookAt(...C.l);
for(const L of sc.lights||[]){let o;
 if(L.t==='hemi'){o=new THREE.HemisphereLight(L.c||0xffffff,L.g||0x444444,L.i);}
 else if(L.t==='amb'){o=new THREE.AmbientLight(L.c||0xffffff,L.i);}
 else if(L.t==='dir'){o=new THREE.DirectionalLight(L.c||0xffffff,L.i); o.position.set(...L.p); if(L.tg){o.target.position.set(...L.tg); S.add(o.target);}
   if(L.shadow){o.castShadow=true; const d=L.sd||220; Object.assign(o.shadow.camera,{left:-d,right:d,top:d,bottom:-d,near:1,far:2000}); o.shadow.mapSize.set(4096,4096); o.shadow.bias=-0.0006; o.shadow.normalBias=0.6; o.shadow.radius=L.sr||3;}}
 else if(L.t==='point'){o=new THREE.PointLight(L.c||0xffffff,L.i,L.d||0,L.decay===undefined?2:L.decay); o.position.set(...L.p);
   if(L.shadow){o.castShadow=true;o.shadow.mapSize.set(1024,1024);o.shadow.bias=-0.002;o.shadow.normalBias=0.3;o.shadow.camera.near=1;o.shadow.camera.far=600;}}
 S.add(o);}
for(const m of sc.meshes){
 const buf=await (await fetch(m.bin)).arrayBuffer();
 const pos=new Float32Array(buf,0,m.nv*3); const idx=new Uint32Array(buf,m.nv*12,m.nt*3);
 let g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx,1));
 if(m.flat!==false){g=g.toNonIndexed();} g.computeVertexNormals();
 if(m.crease){ /* smooth normals kept */ }
 const mat=new THREE.MeshStandardMaterial({color:m.c,roughness:m.rough===undefined?0.8:m.rough,metalness:m.metal||0,side:m.double?THREE.DoubleSide:THREE.FrontSide,
   emissive:new THREE.Color(m.emissive||'#000000'),emissiveIntensity:m.ei||0,transparent:m.opacity!==undefined&&m.opacity<1,opacity:m.opacity===undefined?1:m.opacity,flatShading:m.flat!==false});
 if(m.basic){const bm=new THREE.MeshBasicMaterial({color:m.c,side:THREE.DoubleSide,transparent:m.opacity!==undefined&&m.opacity<1,opacity:m.opacity===undefined?1:m.opacity,toneMapped:m.tm!==false}); const o=new THREE.Mesh(g,bm); S.add(o); continue;}
 const o=new THREE.Mesh(g,mat); o.castShadow=m.cast!==false&&!!sc.shadows; o.receiveShadow=m.recv!==false&&!!sc.shadows; S.add(o);}
if(sc.clip){R.localClippingEnabled=true; const pl=new THREE.Plane(new THREE.Vector3(...sc.clip.n),sc.clip.d); S.traverse(o=>{if(o.isMesh){o.material.clippingPlanes=[pl]; o.material.side=THREE.DoubleSide;}});}
R.render(S,cam); document.title='done';
})().catch(e=>{document.title='err:'+e;});
</script></body></html>
